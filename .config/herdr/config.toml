onboarding = false

[experimental]
pane_history = true

[keys]
prefix = "ctrl+a"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "80%"
height = "80%"

[theme]
auto_switch = true
dark_name = "vesper"
light_name = "solarized-light"

[theme.custom]
active_row_bg = "transparent"

[ui]
hide_tab_bar_when_single_tab = true
mouse_scroll_lines = 1
pane_gaps = false
pane_scrollbars = false
prompt_new_tab_name = false
sidebar_collapsed_mode = "hidden"
status_indicators = "symbols"

[ui.toast.clipboard]
enabled = false

[ui.toast.herdr]
position = "bottom-left"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  ["git_status", "branch"],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace", { token = "tab", bold = true }],
  [{ token = "terminal_title_stripped", dim = false }],
  ["state_text", { token = "agent", bold = true }],
]

[update]
channel = "stable"
manifest_check = true
version_check = true

[worktrees]
directory = "~/.claude/worktrees"

# https://github.com/rdhar/dotfiles/blob/main/.config/herdr/config.toml
